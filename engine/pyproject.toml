[project]
name = "kiez-py-engine"
version = "0.1.0"
description = "Kiez Notes Python API and durable AI workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.13,<2", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
